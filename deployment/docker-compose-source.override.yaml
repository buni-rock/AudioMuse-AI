# Build the checked-out source for both application services.
# Usage: docker compose -f deployment/docker-compose.yaml \
#   -f deployment/docker-compose-source.override.yaml up --build -d
services:
  audiomuse-ai-flask:
    image: audiomuse-ai:source
    build:
      context: ..
      dockerfile: Dockerfile
  audiomuse-ai-worker:
    image: audiomuse-ai:source
    build:
      context: ..
      dockerfile: Dockerfile
